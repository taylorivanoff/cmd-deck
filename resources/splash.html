<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #f5f5f7;
      background: linear-gradient(160deg, #1c1c1e 0%, #243b4a 100%);
      -webkit-app-region: drag;
      user-select: none;
      border-radius: 18px;
      overflow: hidden;
    }
    .icon {
      width: 88px;
      height: 88px;
      margin-bottom: 18px;
      border-radius: 20px;
      animation: pulse 2s ease-in-out infinite;
    }
    .title { font-size: 22px; font-weight: 650; margin-bottom: 6px; }
    .subtitle { font-size: 13px; opacity: 0.7; margin-bottom: 26px; }
    .loader {
      width: 28px;
      height: 28px;
      border: 2.5px solid rgba(255,255,255,0.15);
      border-top-color: #4cc2ff;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }
  </style>
</head>
<body>
  <img class="icon" src="icon.png" alt="CmdDeck">
  <div class="title">CmdDeck</div>
  <div class="subtitle">Loading…</div>
  <div class="loader"></div>
</body>
</html>
