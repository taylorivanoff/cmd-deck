<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; img-src 'self' file: data:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add Macro</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body class="dialog-page editor-page">
  <form class="editor-ide" id="editor-form">
    <header class="ide-toolbar">
      <div class="ide-toolbar-actions">
        <div class="shell-picker ide-shell" id="shell-picker">
          <input type="hidden" id="field-shell" value="" />
          <button type="button" class="shell-picker-trigger" id="shell-picker-trigger" aria-haspopup="listbox"
            aria-expanded="false" title="Run with">
            <span class="shell-picker-text">
              <span class="shell-picker-name" id="shell-picker-name"></span>
              <span class="shell-picker-path" id="shell-picker-path"></span>
            </span>
            <svg class="shell-picker-caret" viewBox="0 0 12 8" width="10" height="7" aria-hidden="true">
              <path fill="currentColor" d="M6 6.8 1.2 2h9.6z" />
            </svg>
          </button>
          <ul class="shell-picker-menu hidden" id="shell-picker-menu" role="listbox"></ul>
        </div>
        <label class="ide-toggle" for="field-terminal" title="Show terminal window">
          <input type="checkbox" id="field-terminal" />
          <span>Terminal</span>
        </label>
      </div>
    </header>

    <div class="ide-main">
      <section class="ide-editor-pane" aria-label="Command editor">
        <div class="code-editor" id="code-editor">
          <pre class="code-gutter" id="code-gutter" aria-hidden="true">1</pre>
          <textarea id="field-command" class="code-input" rows="12" spellcheck="false" wrap="off"
            placeholder="# Enter command or multi-line script&#10;php -v&#10;npm start" required></textarea>
        </div>
        <footer class="ide-statusbar" id="ide-statusbar">
          <span id="status-cursor">Ln 1, Col 1</span>
          <span class="ide-status-sep" aria-hidden="true">·</span>
          <span id="status-lines">1 line</span>
          <span class="ide-status-sep" aria-hidden="true">·</span>
          <span id="status-shell">PowerShell</span>
          <span class="ide-status-hint">Tab indent · Ctrl+S save</span>
        </footer>
      </section>

      <aside class="ide-sidebar">
        <label class="field">
          <span>Display name</span>
          <input type="text" id="field-name" placeholder="Button label" maxlength="80" />
        </label>

        <div class="field">
          <span>Button image</span>
          <div class="image-row">
            <div class="image-preview empty" id="image-preview" aria-hidden="true">None</div>
            <div class="image-actions">
              <button type="button" class="btn" id="btn-pick-image">Choose…</button>
              <button type="button" class="btn ghost" id="btn-clear-image">Remove</button>
            </div>
          </div>
        </div>

        <label class="field">
          <span>Working directory</span>
          <div class="inline-row stacked">
            <input type="text" id="field-cwd" placeholder="Defaults to home" />
            <button type="button" class="btn" id="btn-pick-cwd">Browse…</button>
          </div>
        </label>

        <p class="ide-sidebar-hint" id="shell-hint">Uses this shell’s PATH and environment</p>
      </aside>
    </div>

    <footer class="sheet-footer ide-footer">
      <button type="button" class="btn danger ghost hidden" id="btn-delete">Delete</button>
      <div class="spacer"></div>
      <button type="button" class="btn ghost" id="btn-cancel">Cancel</button>
      <button type="submit" class="btn primary" id="btn-save">Save</button>
    </footer>
  </form>

  <div class="confirm-backdrop hidden" id="delete-dialog" role="dialog" aria-modal="true"
    aria-labelledby="delete-dialog-title">
    <section class="confirm-dialog">
      <h2 id="delete-dialog-title">Delete macro?</h2>
      <p>This action cannot be undone.</p>
      <div class="confirm-actions">
        <button type="button" class="btn ghost" id="delete-cancel">Cancel</button>
        <button type="button" class="btn danger" id="delete-confirm">Delete</button>
      </div>
    </section>
  </div>

  <div class="toast hidden" id="toast" role="status"></div>
  <script src="editor.js"></script>
</body>

</html>
