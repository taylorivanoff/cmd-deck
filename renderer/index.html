<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; img-src 'self' file: data:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CmdDeck</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="app">
    <header class="titlebar">
      <div class="titlebar-drag">
        <h1 class="app-title">CmdDeck</h1>
      </div>
      <div class="titlebar-actions">
        <div class="titlebar-grid" title="Grid size">
          <div class="grid-stepper" data-key="columns" data-min="2" data-max="32">
            <span class="grid-label">Cols</span>
            <input type="text" class="grid-value" id="setting-columns" inputmode="numeric" maxlength="2" aria-label="Columns" value="3" />
            <div class="grid-arrows">
              <button type="button" class="grid-arrow" data-dir="1" aria-label="Increase columns" title="Increase">
                <svg viewBox="0 0 12 8" width="10" height="7" aria-hidden="true"><path fill="currentColor" d="M6 1.2 10.8 6H1.2z"/></svg>
              </button>
              <button type="button" class="grid-arrow" data-dir="-1" aria-label="Decrease columns" title="Decrease">
                <svg viewBox="0 0 12 8" width="10" height="7" aria-hidden="true"><path fill="currentColor" d="M6 6.8 1.2 2h9.6z"/></svg>
              </button>
            </div>
          </div>
          <span class="grid-sep" aria-hidden="true">×</span>
          <div class="grid-stepper" data-key="rows" data-min="1" data-max="32">
            <span class="grid-label">Rows</span>
            <input type="text" class="grid-value" id="setting-rows" inputmode="numeric" maxlength="2" aria-label="Rows" value="3" />
            <div class="grid-arrows">
              <button type="button" class="grid-arrow" data-dir="1" aria-label="Increase rows" title="Increase">
                <svg viewBox="0 0 12 8" width="10" height="7" aria-hidden="true"><path fill="currentColor" d="M6 1.2 10.8 6H1.2z"/></svg>
              </button>
              <button type="button" class="grid-arrow" data-dir="-1" aria-label="Decrease rows" title="Decrease">
                <svg viewBox="0 0 12 8" width="10" height="7" aria-hidden="true"><path fill="currentColor" d="M6 6.8 1.2 2h9.6z"/></svg>
              </button>
            </div>
          </div>
        </div>
        <button type="button" class="icon-btn is-on" id="btn-lock" title="Unlock size" aria-label="Unlock size" aria-pressed="true">
          <svg class="icon-lock" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
            <path fill="currentColor"
              d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM9 6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9V6zm9 14H6V10h12v10zm-6-3c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2z" />
          </svg>
          <svg class="icon-unlock" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
            <path fill="currentColor"
              d="M12 17c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm6-9h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6h1.9c0-1.71 1.39-3.1 3.1-3.1s3.1 1.39 3.1 3.1v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm0 12H6V10h12v10z" />
          </svg>
        </button>
        <button type="button" class="icon-btn" id="btn-settings" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
            <path fill="currentColor"
              d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.15 7.15 0 0 0-1.62-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.57.23-1.11.54-1.62.94l-2.39-.96a.5.5 0 0 0-.6.22L2.77 8.84a.5.5 0 0 0 .12.64l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.14.24.43.34.68.22l2.39-.96c.5.4 1.05.72 1.62.94l.36 2.54c.05.24.26.42.5.42h3.84c.24 0 .45-.18.5-.42l.36-2.54c.57-.22 1.12-.54 1.62-.94l2.39.96c.25.12.54.02.68-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z" />
          </svg>
        </button>
        <button type="button" class="icon-btn primary" id="btn-add" title="Add macro" aria-label="Add macro">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
            <path fill="currentColor" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" />
          </svg>
        </button>
      </div>
    </header>

    <main class="pad" id="pad" aria-label="Macro buttons"></main>

    <p class="hint" id="hint">Click a button to run. Right-click for more.</p>
  </div>

  <div class="toast hidden" id="toast" role="status"></div>

  <div class="ctx-menu hidden" id="ctx-menu" role="menu"></div>

  <script src="app.js"></script>
</body>

</html>
