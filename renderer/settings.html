<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body class="dialog-page settings-page">
  <div class="dialog-sheet settings-sheet">
    <section class="settings-block">
      <h2 class="settings-label">Window</h2>
      <label class="settings-row">
        <span>Always on top</span>
        <input type="checkbox" id="setting-aot" />
      </label>
      <label class="settings-row">
        <span>Start minimised</span>
        <input type="checkbox" id="setting-minimised" />
      </label>
      <label class="settings-row settings-row-slider">
        <span>Transparency</span>
        <input type="range" id="setting-opacity" min="0" max="65" step="1" />
        <output id="setting-opacity-out">6%</output>
      </label>
    </section>

    <section class="settings-block">
      <h2 class="settings-label">Macro packs</h2>
      <div class="settings-btn-row">
        <button type="button" class="btn" id="btn-import-pack">Import…</button>
        <button type="button" class="btn" id="btn-export-pack">Export</button>
      </div>
      <div class="settings-pack-row">
        <select id="pack-select" aria-label="Built-in packs"></select>
        <button type="button" class="btn" id="btn-install-pack">Install</button>
      </div>
    </section>

    <section class="settings-block settings-block-end">
      <div class="settings-btn-row">
        <button type="button" class="btn" id="btn-add-profile">New profile</button>
        <button type="button" class="btn" id="btn-open-log">Activity log</button>
      </div>
      <p class="settings-meta" id="settings-meta"></p>
    </section>
  </div>

  <script src="vendor/tauri-tray-bridge.js"></script>
  <script src="bridge/preload-bridge.js"></script>
  <script src="settings.js"></script>
</body>

</html>
