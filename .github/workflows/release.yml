name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  check-version:
    if: "!startsWith(github.event.head_commit.message, 'chore: bump version')"
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
      ref: ${{ steps.check.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}
      - id: check
        run: |
          set -e
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            CHANGED=$(git diff --name-only HEAD^ HEAD)
          else
            CHANGED=$(git show --pretty="" --name-only HEAD)
          fi

          is_release_relevant() {
            case "$1" in
              package.json|src-tauri/tauri.conf.json|src-tauri/Cargo.toml|Cargo.lock)
                return 0
                ;;
              *.js|*.mjs|*.cjs|*.rs|*.html|*.css)
                return 0
                ;;
              src-tauri/*|renderer/*|sidecar/*)
                return 0
                ;;
            esac
            return 1
          }

          SHOULD_RELEASE=false
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            if is_release_relevant "$file"; then
              SHOULD_RELEASE=true
              break
            fi
          done <<< "$CHANGED"

          if [ "$SHOULD_RELEASE" != true ]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"
            echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CURRENT=$(jq -r .version package.json)
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            OLD=$(git show HEAD^:package.json | jq -r .version)
          else
            OLD=""
          fi

          if [ -n "$OLD" ] && [ "$OLD" = "$CURRENT" ]; then
            npm version patch --no-git-tag-version
            CURRENT=$(jq -r .version package.json)
            # Keep tauri.conf.json in sync
            if [ -f src-tauri/tauri.conf.json ]; then
              jq --arg v "$CURRENT" '.version = $v' src-tauri/tauri.conf.json > src-tauri/tauri.conf.json.tmp
              mv src-tauri/tauri.conf.json.tmp src-tauri/tauri.conf.json
            fi
            if [ -f src-tauri/Cargo.toml ]; then
              sed -i "s/^version = \".*\"/version = \"$CURRENT\"/" src-tauri/Cargo.toml
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml || true
            git commit -m "chore: bump version to ${CURRENT}"
            git push
          fi

          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "version=${CURRENT}" >> "$GITHUB_OUTPUT"
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-and-release:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: --bundles nsis
          - platform: macos-latest
            args: --bundles dmg
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout app
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-version.outputs.ref }}
          path: app
      - name: Checkout tauri-tray-base
        uses: actions/checkout@v4
        with:
          repository: taylorivanoff/tauri-tray-base
          path: tauri-tray-base
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
      - name: Install frontend deps
        working-directory: app
        run: bun install
      - name: Skip updater artifacts without signing key
        working-directory: app
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            jq '.bundle.createUpdaterArtifacts = false' src-tauri/tauri.conf.json > src-tauri/tauri.conf.json.tmp
            mv src-tauri/tauri.conf.json.tmp src-tauri/tauri.conf.json
            echo "No TAURI_SIGNING_PRIVATE_KEY — disabled createUpdaterArtifacts"
          else
            echo "TAURI_SIGNING_PRIVATE_KEY present — updater artifacts enabled"
          fi
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: v__VERSION__
          releaseName: v__VERSION__
          releaseBody: "See the assets below to download and install."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
